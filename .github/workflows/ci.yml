name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: eldenele_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:123456@localhost:5432/eldenele_db
          JWT_SECRET: ci-test-secret
          ADMIN_API_KEY: ci-admin-key
        run: pytest -q

  # Staging deploy: repository Secrets ile (ör. RENDER_API_KEY) genişletilebilir
  staging-placeholder:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Staging deploy adımı — barındırma sağlayıcısı secret'ları eklendiğinde aktif edin."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
